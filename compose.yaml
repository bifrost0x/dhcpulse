services:
  dhcpulse:
    image: ghcr.io/bifrost0x/dhcpulse:latest
    restart: unless-stopped
    ports:
      - "${DHCPULSE_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
