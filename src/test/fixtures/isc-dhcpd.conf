# Synthetic ISC DHCP configuration.
default-lease-time 28800;
max-lease-time 57600;
option domain-name "example.com";
option domain-name-servers 198.51.100.53;

failover peer "example-ha" {
  primary;
  address 198.51.100.2;
  peer address 198.51.100.3;
}

shared-network "documentation" {
  subnet 198.51.100.0 netmask 255.255.255.0 {
    option routers 198.51.100.1;
    pool {
      failover peer "example-ha";
      range 198.51.100.20 198.51.100.120;
    }
    host printer-example {
      hardware ethernet 02:00:5e:10:00:03;
      fixed-address 198.51.100.50;
    }
    if exists user-class { log(info, "unsupported example"); }
  }
}

class "documentation-clients" {
  match if substring(option vendor-class-identifier, 0, 7) = "example";
}
