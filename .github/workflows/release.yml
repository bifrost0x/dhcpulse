name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  NODE_VERSION: 26.7.0

jobs:
  static-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify release source and version
        shell: bash
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --input-type=module --eval \
            "import pkg from './package.json' with { type: 'json' }; if (process.env.GITHUB_REF_NAME !== 'v' + pkg.version) throw new Error('Tag and package version differ.');"
      - run: npm ci
      - run: npm run check:repo
      - run: npm run audit:dependencies
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - name: Build static archives, SBOM, and checksums
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          package_directory="release/dhcpulse-${release_version}"
          source_date_epoch="$(git show --no-patch --format=%ct "$GITHUB_SHA")"
          mkdir --parents "$package_directory"
          cp --recursive dist/. "$package_directory/"
          find "$package_directory" -exec touch --date="@${source_date_epoch}" {} +
          (cd release && find "dhcpulse-${release_version}" -type f -print | LC_ALL=C sort | zip -X --quiet "dhcpulse-${release_version}-static.zip" --names-stdin)
          tar --directory release --sort=name --mtime="@${source_date_epoch}" \
            --owner=0 --group=0 --numeric-owner --create --gzip \
            --file "release/dhcpulse-${release_version}-static.tar.gz" \
            "dhcpulse-${release_version}"
          rm --recursive "$package_directory"
          npm sbom --sbom-format=cyclonedx > "release/dhcpulse-${release_version}.sbom.cdx.json"
          node scripts/normalize-sbom.mjs "release/dhcpulse-${release_version}.sbom.cdx.json" "$source_date_epoch"
          (cd release && find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.json' \) -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error
          retention-days: 7

  container:
    name: Container (${{ matrix.arch }})
    needs: static-artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to GitHub Container Registry
        shell: bash
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native image
        id: image
        shell: bash
        run: |
          docker buildx create --use --name dhcpulse-release
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg "VERSION=${GITHUB_REF_NAME#v}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file build-metadata.json \
            --push .
          digest="$(jq --raw-output '.["containerimage.digest"]' build-metadata.json)"
          test "$digest" != "null"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest native image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [static-artifacts, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release
      - name: Sign in to GitHub Container Registry
        shell: bash
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image
        id: image
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          major="${release_version%%.*}"
          minor_patch="${release_version#*.}"
          minor="${minor_patch%%.*}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${release_version}" \
            --tag "${IMAGE_NAME}:${major}.${minor}" \
            --tag "${IMAGE_NAME}:${major}" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE_NAME}:${GITHUB_REF_NAME}-arm64"
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${release_version}" --format '{{json .Manifest.Digest}}' | tr --delete '\"')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest multi-architecture image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "DHCPulse $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
